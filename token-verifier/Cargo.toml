[package]
name = "token-verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rusty_paseto = { version = "0.10.0", default-features = false, features = ["batteries_included", "v4_public"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
